# Reverse-proxy directives for the ANALYTIC GEOMETRY Builder — APACHE.
#
# The analytic builder (`/analytic-builder/`) is the fourth sibling and shares the SAME Node proxy
# process (127.0.0.1:8788, server/standalone.ts) as the other three. Written AS PART OF its first
# deploy (prod/2026-09-16), which is the point of ADR-W-043: the complex builder was added to the
# deploy table with no conf and answered 404 on `/complex-builder/api/*` for a month before anyone
# noticed, because every consumer has a deliberate degraded path.
#
# IMPORTANT (same as the other three confs): on themathbible.com nginx is OFF; the box serves HTTPS
# via Apache directly. Append these to the domain's "Additional HTTPS Apache directives":
#   /var/www/vhosts/system/themathbible.com/conf/vhost_ssl.conf
# (Plesk > themathbible.com > Apache & nginx Settings > "Additional directives for HTTPS")
# then: apache2ctl -t && systemctl reload apache2
#
# Direct `vhost_ssl.conf` edits do NOT survive a Plesk regeneration — paste into the Plesk field.
#
# The proxy strips the `/analytic-builder` prefix and the Node server matches on the path TAIL, so
# the same bundle works prefixed or not.
#
# INSTALLED IN PLESK 2026-09-20, and NOT BEFORE — the gap this file was written to prevent happened
# anyway, one step later. The file existed from the analytic builder's first deploy (prod/2026-09-16)
# and was never pasted into the GUI field, so `/analytic-builder/api/*` answered 404 for four days.
# Nothing noticed, because the sentence below was true at the time:
#
#   "WHAT THIS PRODUCT FETCHES TODAY: nothing. `src-analytic/` makes no network call at all."
#
# That stopped being true at `prod/2026-09-20`, which shipped the analytic LLM fallback (#1251). The
# app's only network call is POST `/analytic-builder/api/parse`, and without the ProxyPass below Apache
# looks for a FILE of that name, 404s, and the fallback silently does nothing — the feature is live in
# the bundle and dead on the server. Found by hand an hour after shipping; see #1279, which carries the
# durable fix: `deploy:preflight` must probe each enabled product's declared tails and refuse a deploy
# on a 404. **A conf that is written and never installed is the same outage as a conf never written.**
#
# They are here anyway, and deliberately:
#
#   /api/config  — the per-tool operator curation read (A3, #662). `server/admin.ts` ALREADY carries
#                  an `analytic` tool entry, so the dashboard can curate this builder the moment the
#                  app fetches it. Routing it now means that is a code change, not a server change
#                  requiring a Plesk edit and an Apache reload.
#   /api/parse   — the LLM fallback tail. No consumer here; this product's grammar is deterministic
#                  by design, and if it ever escalates, the path exists.
#   /api/log     — the usage-event sink (the body's `tool` tag does the file split). Same reasoning;
#                  this is also what log-triage would need to see what students type.
#
# NO `/admin` LINE, deliberately — the same reasoning as the complex conf. This builder has no
# dashboard mount of its own, and Apache strips the prefix, so `/analytic-builder/admin` would reach
# the bare `/admin` tail and serve the 2-D DASHBOARD under the analytic prefix: worse than a 404.
# The operator curates it from the existing dashboard: /geo-builder/admin/config?tool=analytic.

ProxyPass /analytic-builder/api/config http://127.0.0.1:8788/api/config
ProxyPassReverse /analytic-builder/api/config http://127.0.0.1:8788/api/config
ProxyPass /analytic-builder/api/parse http://127.0.0.1:8788/api/parse
ProxyPassReverse /analytic-builder/api/parse http://127.0.0.1:8788/api/parse
ProxyPass /analytic-builder/api/log http://127.0.0.1:8788/api/log
ProxyPassReverse /analytic-builder/api/log http://127.0.0.1:8788/api/log

# SPA cache policy (needs mod_headers) — identical to the siblings', and for the same reason:
# without it Apache sends no Cache-Control for index.html, browsers heuristically cache the OLD
# entry point, and a deploy keeps loading a stale hashed bundle.
<Directory /var/www/vhosts/themathbible.com/httpdocs/analytic-builder>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
    <FilesMatch "-[A-Za-z0-9_]+\.(js|css)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>
