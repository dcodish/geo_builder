# Reverse-proxy directive for the Geo Builder LLM proxy.
#
# On a Plesk box, paste this into:
#   Domains > themathbible.com > Apache & nginx Settings
#   > "Additional nginx directives"
# (then Apply). On a plain nginx box, put it inside the server { } block for the
# site. The static SPA under /geo-builder/ is served straight from httpdocs by the
# web server; only /api/parse is proxied to the Node service.

location /geo-builder/api/parse {
    proxy_pass http://127.0.0.1:8788/api/parse;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

# Optional: a health probe you can curl from the box.
#   curl http://127.0.0.1:8788/healthz   ->   ok
