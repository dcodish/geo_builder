# Reverse-proxy directive for the Geo Builder LLM proxy — APACHE.
#
# IMPORTANT: on themathbible.com nginx is DISABLED (failed/off since 2026-04);
# the box serves over HTTPS via Apache directly. The existing app proxies
# (/hw/ -> 8000, /akinator -> 5000, /bagrut -> 3000, /akinator2 -> 5001) all live
# in the HTTPS vhost include, so this goes there too.
#
# Append to the domain's "Additional HTTPS Apache directives" — the file:
#   /var/www/vhosts/system/themathbible.com/conf/vhost_ssl.conf
# (equivalently: Plesk > themathbible.com > Apache & nginx Settings >
#  "Additional directives for HTTPS"). Then: apache2ctl -t && systemctl reload apache2
#
# Three paths are proxied to the Node service; the static SPA under /geo-builder/
# is served from httpdocs by Apache's default static handling (no directive needed):
#   /api/parse  — LLM fallback (Phase 7)
#   /api/log    — usage-event sink (admin dashboard data; hashes the visitor IP)
#   /api/config — the per-tool operator curation read (A3, #662; added by #903)
#   /admin      — the password-protected usage dashboard
#
# IMPORTANT: keep the /admin and /api lines BEFORE any catch-all, and note the
# proxy strips the /geo-builder prefix (the Node server matches on the path TAIL,
# e.g. .../admin, .../api/log), so the same bundle works prefixed or not.

ProxyPass /geo-builder/api/parse http://127.0.0.1:8788/api/parse
ProxyPassReverse /geo-builder/api/parse http://127.0.0.1:8788/api/parse
ProxyPass /geo-builder/api/log http://127.0.0.1:8788/api/log
ProxyPassReverse /geo-builder/api/log http://127.0.0.1:8788/api/log
# #903: the per-tool operator curation read (A3, #662). The route has existed server-side since
# #662 and was proxied for no product, so a value set in the dashboard could never reach a
# student's app. 2-D has no consumer yet; routed so that adding one is a code change only.
ProxyPass /geo-builder/api/config http://127.0.0.1:8788/api/config
ProxyPassReverse /geo-builder/api/config http://127.0.0.1:8788/api/config
ProxyPass /geo-builder/admin http://127.0.0.1:8788/admin
ProxyPassReverse /geo-builder/admin http://127.0.0.1:8788/admin

# #1374 — the SHARE STORE. Two routes, and the second one is deliberately NOT under a builder
# prefix: the operator asked for «https://themathbible.com/<something short>», and a link-preview
# crawler (WhatsApp, Telegram, Slack) reads OpenGraph tags from the URL it is GIVEN — it does not
# follow a builder's path. `/g/<id>` is therefore top-level and shared by all four builders; the
# page it serves redirects the student on to whichever builder the figure belongs to.
#
# `api/share` is the upload (POST only; the handler refuses anything else).
ProxyPass /geo-builder/api/share http://127.0.0.1:8788/api/share
ProxyPassReverse /geo-builder/api/share http://127.0.0.1:8788/api/share
ProxyPass /g/ http://127.0.0.1:8788/g/
ProxyPassReverse /g/ http://127.0.0.1:8788/g/

# SPA cache policy (needs mod_headers). Without this Apache sends no Cache-Control
# for index.html, so browsers heuristically cache the OLD entry point and keep
# loading a stale (still-present) hashed bundle after a deploy — the figure then
# renders with old code. Fix: never cache the HTML entry (always revalidate via
# ETag), but cache the content-hashed JS/CSS forever (their names change per build,
# so it's always safe). A deploy is then picked up on the next page load.
<Directory /var/www/vhosts/themathbible.com/httpdocs/geo-builder>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
    <FilesMatch "-[A-Za-z0-9_]+\.(js|css)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>

# #1380 (ADR-W-104) — SECURITY RESPONSE HEADERS (needs mod_headers, already loaded for Cache-Control).
# A <Location> block, NOT a vhost-wide "Header set": this file is pasted into the vhost every app on
# themathbible.com shares (/hw/, /akinator, /bagrut…), and those are not ours to change. It covers the
# static app AND every route proxied under the prefix (api/*, admin).
#   nosniff         — a response is only ever read as its declared type (the /g/ PNG bytes are uploaded).
#   SAMEORIGIN      — no other site may frame the builder or its dashboard (click-jacking).
#   Referrer-Policy — a cross-site request carries the origin only, never the path.
#   CSP REPORT-ONLY — measured, NOT enforced: a wrong enforcing policy would blank the live app. It is
#                     promoted to "Content-Security-Policy" in a separate change, after the browser
#                     consoles are clean (the admin dashboards' inline scripts are known reporters).
<Location /geo-builder/>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy-Report-Only "script-src 'self'; object-src 'none'; base-uri 'self'"
</Location>

# #1380 — the same headers on the top-level /g/ share page and its PNG (#1374). The page's one inline
# script is CONSTANT (server/shareStore.ts SHARE_HANDOFF_SCRIPT) so a single hash allows it; a lock in
# server/__tests__/deploy-proxy-confs.test.ts holds this hash equal to that string's.
<Location /g/>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy-Report-Only "script-src 'self' 'sha256-Q+cipAr3yJ+gTSf87C9b9bxhUnkKNB3mJeC1jrkwGbo='; object-src 'none'; base-uri 'self'"
</Location>
