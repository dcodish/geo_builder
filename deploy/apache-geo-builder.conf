# Reverse-proxy directive for the Geo Builder LLM proxy — APACHE.
#
# IMPORTANT: on themathbible.com nginx is DISABLED (failed/off since 2026-04);
# the box serves over HTTPS via Apache directly. The existing app proxies
# (/hw/ -> 8000, /akinator -> 5000, /bagrut -> 3000, /akinator2 -> 5001) all live
# in the HTTPS vhost include, so this goes there too.
#
# Append to the domain's "Additional HTTPS Apache directives" — the file:
#   /var/www/vhosts/system/themathbible.com/conf/vhost_ssl.conf
# (equivalently: Plesk > themathbible.com > Apache & nginx Settings >
#  "Additional directives for HTTPS"). Then: apache2ctl -t && systemctl reload apache2
#
# Only /api/parse is proxied; the static SPA under /geo-builder/ is served from
# httpdocs by Apache's default static handling (no directive needed).

ProxyPass /geo-builder/api/parse http://127.0.0.1:8788/api/parse
ProxyPassReverse /geo-builder/api/parse http://127.0.0.1:8788/api/parse
