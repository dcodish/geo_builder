# Reverse-proxy directives for the COMPLEX Builder — APACHE.
#
# The complex builder (`/complex-builder/`) is a sibling of the 2-D and 3-D builders and shares the
# SAME Node proxy process (127.0.0.1:8788, server/standalone.ts). It was added to the deploy table
# without a proxy rule, so `/complex-builder/api/*` answered 404 from the day it shipped
# (prod/2026-08-15-2) — see issue #903 and ADR-W-043.
#
# IMPORTANT (same as the other two confs): on themathbible.com nginx is OFF; the box serves HTTPS via
# Apache directly. Append these to the domain's "Additional HTTPS Apache directives":
#   /var/www/vhosts/system/themathbible.com/conf/vhost_ssl.conf
# (Plesk > themathbible.com > Apache & nginx Settings > "Additional directives for HTTPS")
# then: apache2ctl -t && systemctl reload apache2
#
# Direct `vhost_ssl.conf` edits do NOT survive a Plesk regeneration — paste into the Plesk field.
#
# The proxy strips the `/complex-builder` prefix and the Node server matches on the path TAIL, so the
# same bundle works prefixed or not:
#
#   /api/config  — the per-tool operator curation read (A3, #662). THE ONE THIS PRODUCT ACTUALLY USES
#                  today: src-complex/App.tsx fetches it on mount. Without this line the app's
#                  degraded path silently swallows the 404 and the operator's curation is inert.
#   /api/parse   — the LLM fallback tail. No consumer in src-complex/ yet; routed so that adding one
#                  is a code change, not a server change.
#   /api/log     — the usage-event sink (the body's `tool` tag does the file split). Same reasoning.
#
# NO `/admin` LINE, deliberately. The complex builder has no dashboard mount of its own (it does not
# log), and Apache strips the prefix — so `/complex-builder/admin` would reach the bare `/admin` tail
# and serve the 2-D DASHBOARD under the complex prefix, which is worse than a 404. The operator
# curates this tool from the existing dashboard's config page: /geo-builder/admin/config?tool=complex.
# When complex grows its own events file and dashboard profile, it gets a distinct tail (as 3-D did
# with /admin3) and a line here.

ProxyPass /complex-builder/api/config http://127.0.0.1:8788/api/config
ProxyPassReverse /complex-builder/api/config http://127.0.0.1:8788/api/config
ProxyPass /complex-builder/api/parse http://127.0.0.1:8788/api/parse
ProxyPassReverse /complex-builder/api/parse http://127.0.0.1:8788/api/parse
ProxyPass /complex-builder/api/log http://127.0.0.1:8788/api/log
ProxyPassReverse /complex-builder/api/log http://127.0.0.1:8788/api/log

# SPA cache policy (needs mod_headers) — identical to the 2-D conf's, and for the same reason:
# without it Apache sends no Cache-Control for index.html, browsers heuristically cache the OLD
# entry point, and a deploy keeps loading a stale hashed bundle.
<Directory /var/www/vhosts/themathbible.com/httpdocs/complex-builder>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
    <FilesMatch "-[A-Za-z0-9_]+\.(js|css)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>
