# Reverse-proxy directives for the 3-D Builder usage dashboard — APACHE.
#
# The 3-D app (`/3d-builder/`) is a sibling of the 2-D Geo Builder and shares the
# SAME Node proxy process (127.0.0.1:8788, server/standalone.ts). Its LLM fallback
# already rides the existing `/geo-builder/api/parse` route (see src3d/parser/llm3.ts),
# so only TWO new paths are needed — the usage-event sink and the dashboard:
#
#   /3d-builder/api/log  — 3-D usage-event sink (routed to events-3d.jsonl by the
#                          request body's `tool:'3d'` tag; hashes the visitor IP)
#   /3d-builder/admin    — the password-protected 3-D usage dashboard
#   /3d-builder/api/config — the per-tool operator curation read (A3, #662; added by #903)
#
# IMPORTANT (same as the 2-D conf): on themathbible.com nginx is OFF; the box serves
# HTTPS via Apache. Append these to the domain's "Additional HTTPS Apache directives":
#   /var/www/vhosts/system/themathbible.com/conf/vhost_ssl.conf
# (Plesk > themathbible.com > Apache & nginx Settings > "Additional directives for HTTPS")
# then: apache2ctl -t && systemctl reload apache2
#
# NOTE the admin TAIL differs: Apache strips the `/3d-builder` prefix, so the Node
# server would see a bare `/admin` — indistinguishable from the 2-D dashboard. We
# therefore map the 3-D admin to the DISTINCT `/admin3` tail, which standalone.ts
# routes to the 3-D profile + events-3d.jsonl. The `/api/log` tail is shared (the
# body's `tool` tag does the file split), exactly like `/api/parse`.

ProxyPass /3d-builder/api/log http://127.0.0.1:8788/api/log
ProxyPassReverse /3d-builder/api/log http://127.0.0.1:8788/api/log
# #903: the per-tool operator curation read (A3, #662) — see the 2-D conf. No 3-D consumer yet;
# routed so the hole cannot reappear the moment one is added.
ProxyPass /3d-builder/api/config http://127.0.0.1:8788/api/config
ProxyPassReverse /3d-builder/api/config http://127.0.0.1:8788/api/config
ProxyPass /3d-builder/admin http://127.0.0.1:8788/admin3
ProxyPassReverse /3d-builder/admin http://127.0.0.1:8788/admin3
