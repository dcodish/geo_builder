<title>{{TITLE}}</title>
<!--
  #1853 (ADR-W-116) — the LIVE ROUND DASHBOARD. Tracking only: what is in the round, what each item is
  about, and where it is now. The end-of-round report and play sheet stay their own page (Step 5b), which
  this one only links to. One template for every round: published once per round by the fix-round skill
  (`node scripts/round-event.mjs page <round> --out …`), declared with capabilities {db:{}}, and filled
  by the orchestrator writing `round/state` (the fold of the round's event log). Nothing round-specific
  is in this file except the title.
-->
<style>
/* Layout: one reading column — status header, pipeline stepper, item ledger, activity. */
:root{
  --bg:#faf9f7;--card:#ffffff;--ink:#20242e;--muted:#69707d;--line:#e3e0da;--accent:#3d5a80;
  --ok:#1a7f42;--bad:#b3382c;--warn:#b45309;--work:#3d5a80;--idle:#9aa1ad;
  --font-ui:system-ui,'Segoe UI',Arial,sans-serif;--font-mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181a20;--card:#20232c;--ink:#e8e6e1;--muted:#9aa1ad;--line:#333845;--accent:#8fb3d9;
  --ok:#4fc47f;--bad:#e0705f;--warn:#e0a353;--work:#8fb3d9;--idle:#5d6472;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181a20;--card:#20232c;--ink:#e8e6e1;--muted:#9aa1ad;--line:#333845;--accent:#8fb3d9;
  --ok:#4fc47f;--bad:#e0705f;--warn:#e0a353;--work:#8fb3d9;--idle:#5d6472;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);margin:0;padding-block:24px;padding-inline:16px;line-height:1.55}
main{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:0;border-block-end:1px solid var(--line);padding-block-end:6px;text-wrap:balance}
a{color:var(--accent)}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--font-mono);font-size:.9em}
header{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted);margin:0}
.stale{color:var(--warn);font-weight:600}
.report{display:inline-block;font-weight:600;border:1px solid var(--accent);border-radius:6px;padding:4px 12px;text-decoration:none}
.report:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .s-ok{background:var(--ok)}.bar .s-pr{background:var(--accent)}.bar .s-bad{background:var(--bad)}.bar .s-skip{background:var(--idle)}.bar .s-ready{background:var(--ok);opacity:.4}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;font-size:.88rem;font-variant-numeric:tabular-nums}
.tally li{border:1px solid var(--line);border-radius:6px;padding:2px 10px;background:var(--card)}
/* stepper */
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:0;padding:0;list-style:none}
.steps li{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
.steps li::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.steps li.done::before{background:var(--ok)}
.steps li.now::before{background:var(--work)}
.steps li.now{color:var(--ink);font-weight:600}
.steps time{font-size:.75rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){.steps{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px}}
/* items */
.items{display:flex;flex-direction:column;gap:8px}
details.item{background:var(--card);border:1px solid var(--line);border-radius:8px}
details.item>summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ititle{min-width:0;overflow-wrap:anywhere}
.ititle small{display:block;color:var(--muted);font-size:.82rem}
.pill{font-size:.78rem;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1px solid currentColor}
.pill.work{color:var(--work)}.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.idle{color:var(--muted)}.pill.warn{color:var(--warn)}
.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:.93rem}
.body p{margin:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin:0}
ol.tl{margin:0;padding-inline-start:18px;font-size:.85rem;display:flex;flex-direction:column;gap:2px}
ol.tl time{color:var(--muted);font-variant-numeric:tabular-nums;margin-inline-end:6px}
/* activity + empty */
ul.feed{margin:0;padding:0;list-style:none;font-size:.85rem;display:flex;flex-direction:column;gap:3px}
ul.feed li{display:flex;gap:10px;align-items:baseline}
ul.feed time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
ul.feed .what{min-width:0;overflow-wrap:anywhere}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .4s ease}}
</style>

<main dir="rtl" lang="he">
  <header>
    <h1 id="h">{{TITLE}}</h1>
    <p class="meta" id="meta"><span>ממתין לנתונים מהסשן…</span></p>
    <div class="bar" id="bar" role="img" aria-label="התקדמות"></div>
    <ul class="tally" id="tally"></ul>
    <p id="report" hidden></p>
  </header>

  <section aria-labelledby="pipe-h">
    <h2 id="pipe-h">שלבי הסבב</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section aria-labelledby="items-h">
    <h2 id="items-h">הפריטים בסבב</h2>
    <div class="items" id="items">
      <div class="empty">הפריטים יופיעו כאן כשהסשן יסיים להרכיב את הסבב: לכל פריט מספר הגיליון, על מה הוא, תוכנית התיקון, ובאיזה שלב הוא עכשיו.</div>
    </div>
  </section>

  <section aria-labelledby="feed-h">
    <h2 id="feed-h">פעילות אחרונה</h2>
    <ul class="feed" id="feed"><li class="muted">עדיין אין אירועים.</li></ul>
  </section>
</main>

<script>
(() => {
  const ROUND = [
    ['compose', 'הרכבה'], ['execute', 'תיקון'], ['batch', 'בדיקת אצווה'], ['land', 'הטמעה'],
    ['playsheet', 'דף בדיקה'], ['awaiting-play', 'ממתין לך'],
  ];
  const ITEM = {
    queued: ['בתור', 'idle'], remeasure: ['מדידה מחדש', 'work'], fixing: ['בתיקון', 'work'], gates: ['בדיקות', 'work'],
    ready: ['מוכן לאצווה', 'warn'], landed: ['ב-main', 'ok'], pr: ['PR פתוח', 'ok'], escalated: ['הועבר אליך', 'bad'],
    skipped: ['דולג', 'idle'], closed: ['כבר תוקן', 'idle'],
  };
  const REPO = 'https://github.com/dcodish/geo_builder';
  /** A sync older than this, mid-round, is shown as stale — the page is only as live as the session. */
  const STALE_MIN = 20;

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k);
    return n;
  };
  const hhmm = (t) => (t ? new Date(t).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '');
  const ago = (t) => {
    if (!t) return '';
    const m = Math.round((Date.now() - Date.parse(t)) / 60000);
    if (m < 1) return 'עכשיו';
    if (m < 60) return `לפני ${m} דק׳`;
    const h = Math.floor(m / 60);
    return `לפני ${h} ש׳ ${m % 60} דק׳`;
  };
  /** Free text (titles, notes, plans) may be English or Hebrew: isolate it so its punctuation stays put. */
  const bdi = (t) => (t ? el('bdi', { text: t }) : null);
  const issueLink = (n) => el('a', { href: `${REPO}/issues/${n}`, target: '_blank', rel: 'noopener', class: 'num' }, `#${n}`);

  let state = null;
  let db = null;
  const open = new Set(); // expanded items survive a redraw

  function render() {
    if (!state) return;
    renderHeader();
    renderItems();
    renderFeed();
  }

  function renderHeader() {
    const c = state.counts || {};
    // header
    const meta = $('meta');
    meta.replaceChildren();
    if (state.title) meta.append(bdi(state.title));
    if (state.issueUrl) meta.append(el('a', { href: state.issueUrl, target: '_blank', rel: 'noopener' }, 'גיליון הסבב'));
    const live = state.phase && state.phase !== 'awaiting-play';
    const stale = live && state.updatedAt && Date.now() - Date.parse(state.updatedAt) > STALE_MIN * 60000;
    meta.append(el('span', { class: stale ? 'stale' : null, title: state.updatedAt || '' },
      `עדכון אחרון ${ago(state.updatedAt)}${stale ? ' — ייתכן שהסשן לא מסנכרן' : ''}`));
    if (state.startedAt) meta.append(el('span', { text: `התחיל ${hhmm(state.startedAt)}` }));
    // bar
    const total = c.total || 0;
    const seg = (n, cls) => (n ? el('span', { class: cls, style: `width:${(100 * n) / total}%` }) : null);
    $('bar').replaceChildren(...(total ? [seg(c.landed, 's-ok'), seg(c.pr, 's-pr'), seg(c.escalated, 's-bad'), seg((c.skipped || 0) + (c.closed || 0), 's-skip'), seg(c.ready, 's-ready')].filter(Boolean) : []));
    $('bar').setAttribute('aria-label', `${c.done || 0} מתוך ${total} פריטים הסתיימו, ${c.ready || 0} מוכנים לאצווה`);
    const working = (c.remeasure || 0) + (c.fixing || 0) + (c.gates || 0);
    $('tally').replaceChildren(
      el('li', {}, el('strong', { text: `${c.done || 0}/${total}` }), ' הסתיימו'),
      ...[['בעבודה', working], ['מוכנים לאצווה', c.ready], ['ב-main', c.landed], ['PR', c.pr], ['הועברו אליך', c.escalated], ['דולגו / כבר תוקנו', (c.skipped || 0) + (c.closed || 0)], ['בתור', c.queued]]
        .filter(([, n]) => n).map(([l, n]) => el('li', { text: `${l}: ${n}` })),
    );
    // stepper
    const at = Object.fromEntries((state.phases || []).map((p) => [p.id, p.at]));
    const nowIdx = ROUND.findIndex(([id]) => id === state.phase);
    $('steps').replaceChildren(...ROUND.map(([id, he], i) =>
      el('li', { class: i < nowIdx ? 'done' : i === nowIdx ? 'now' : null, 'aria-current': i === nowIdx ? 'step' : null },
        el('span', { text: he }), el('time', { text: hhmm(at[id]) }))));
    const rep = $('report');
    rep.hidden = !state.reportUrl;
    if (state.reportUrl) rep.replaceChildren(el('a', { class: 'report', href: state.reportUrl, target: '_blank', rel: 'noopener', text: 'לדף הבדיקה של הסבב ←' }));
  }

  function renderItems() {
    const items = state.items || [];
    if (!items.length) return;
    $('items').replaceChildren(...items.map((it) => {
      const [phHe, phCls] = ITEM[it.phase] || [it.phase, 'idle'];
      const d = el('details', { class: 'item', open: open.has(it.key) });
      d.addEventListener('toggle', () => (d.open ? open.add(it.key) : open.delete(it.key)));
      const nums = el('span', {}, ...it.issues.flatMap((n, i) => (i ? [' + ', issueLink(n)] : [issueLink(n)])));
      nums.addEventListener('click', (e) => e.stopPropagation());
      d.append(
        el('summary', {},
          nums,
          el('span', { class: 'ititle' }, bdi(it.title || '(ללא כותרת)'), el('small', { text: [it.route === 'feature' ? 'פיצ׳ר · PR' : it.route === 'bug' ? 'באג · ל-main' : null, it.stream ? `זרם ${it.stream}` : null, it.since ? `בשלב הזה ${ago(it.since)}` : null].filter(Boolean).join(' · ') })),
          el('span', { class: `pill ${phCls}`, text: phHe }),
        ),
      );
      const facts = [
        it.branch && el('span', {}, 'ענף: ', el('span', { class: 'ltr', text: it.branch })),
        it.sha && el('span', {}, 'קומיט: ', el('a', { class: 'ltr', href: `${REPO}/commit/${it.sha}`, target: '_blank', rel: 'noopener', text: it.sha.slice(0, 8) })),
        it.pr && el('span', {}, 'PR: ', el('a', { href: `${REPO}/pull/${it.pr}`, target: '_blank', rel: 'noopener', text: `#${it.pr}` })),
        it.adrs && it.adrs.length && el('span', {}, 'ADR: ', el('span', { class: 'ltr', text: it.adrs.join(', ') })),
      ].filter(Boolean);
      const last = [...(it.timeline || [])].reverse().find((e) => e.note);
      d.append(el('div', { class: 'body' },
        it.about && el('p', {}, el('strong', { text: 'על מה: ' }), bdi(it.about)),
        it.plan && el('p', {}, el('strong', { text: 'התוכנית: ' }), bdi(it.plan)),
        last && el('p', {}, el('strong', { text: 'עכשיו: ' }), bdi(last.note)),
        it.deviations && el('p', {}, el('strong', { text: 'סטיות מהתוכנית: ' }), bdi(it.deviations)),
        facts.length > 0 && el('p', { class: 'facts' }, ...facts),
        (it.timeline || []).length > 0 && el('ol', { class: 'tl' }, ...it.timeline.map((e) =>
          el('li', {}, el('time', { text: hhmm(e.t) }), (ITEM[e.phase] || [e.phase])[0], e.note ? ' — ' : '', bdi(e.note)))),
      ));
      return d;
    }));
  }

  function renderFeed() {
    const f = state.feed || [];
    if (!f.length) return;
    $('feed').replaceChildren(...f.slice(0, 15).map((e) => el('li', {}, el('time', { text: hhmm(e.t) }),
      el('span', { class: 'what' },
        e.kind === 'item' ? el('bdi', { class: 'num', text: `#${e.item}` }) : null,
        e.kind === 'item' ? ` ← ${(ITEM[e.phase] || [e.phase])[0]}` : e.kind === 'round' ? `הסבב ← ${(ROUND.find(([id]) => id === e.phase) || [, e.phase])[1]}` : 'הערה',
        e.note ? ' — ' : '', bdi(e.note)))));
  }

  (async () => {
    db = window.claude?.use ? await window.claude.use('db') : null;
    if (!db) {
      $('meta').replaceChildren(el('span', { text: 'פתחו את הדף ב-claude.ai כדי לראות את הסבב החי.' }));
      return;
    }
    db.doc('round/state').onSnapshot((snap) => {
      if (!snap.exists) return;
      state = snap.data();
      render();
    }, (e) => $('meta').append(el('span', { class: 'stale', text: `החיבור לנתונים נקטע (${e.code || ''})` })));
    // "ago" labels and the stale warning age without a new snapshot.
    setInterval(() => state && renderHeader(), 60000);
  })();
})();
</script>
