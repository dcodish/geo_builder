name: CI

# Per-product CI lanes (ADR-266, issue #13): a `changes` job classifies the diff and
# only the affected product lanes run. Anything on the SHARED surface (server/,
# package.json, tsconfig, vite.config.ts, .github/, or any uncategorized new path)
# runs every lane — unknown-by-default is "run everything", never "skip".
# Each lane still runs `tsc -b` (tsconfig includes src + src3d), so every lane
# typechecks the whole repo — the cross-product safety net stays.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reports/**'
      - 'deploy/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reports/**'
      - 'deploy/**'
      - '.claude/**'

# A newer push to the same branch/PR cancels the still-running older run —
# only the latest state matters, and each run costs free-tier minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run2d: ${{ steps.classify.outputs.run2d }}
      run3d: ${{ steps.classify.outputs.run3d }}
      runcomplex: ${{ steps.classify.outputs.runcomplex }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths per product
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # New branch / force push / unknown base → cannot diff → run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no usable diff base ($BASE) - running all lanes"
            echo "run2d=true" >> "$GITHUB_OUTPUT"
            echo "run3d=true" >> "$GITHUB_OUTPUT"
            echo "runcomplex=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app2d=false; app3d=false; appcomplex=false; shared=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|reports/*|deploy/*|.claude/*|*.md) ;;                # docs-only: no lane
              src3d/*|3d.html|fixtures3/*|vite.config.3d.ts) app3d=true ;;
              src-complex/*|complex.html|fixtures-complex/*|vite.config.complex.ts) appcomplex=true ;;
              src/*|index.html) app2d=true ;;
              *) shared=true ;;   # server/, package*.json, tsconfig*, vite.config.ts, .github/, anything new
            esac
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          run2d=false; run3d=false; runcomplex=false
          { [ "$shared" = true ] || [ "$app2d" = true ]; } && run2d=true
          { [ "$shared" = true ] || [ "$app3d" = true ]; } && run3d=true
          { [ "$shared" = true ] || [ "$appcomplex" = true ]; } && runcomplex=true
          echo "classified: app2d=$app2d app3d=$app3d appcomplex=$appcomplex shared=$shared -> run2d=$run2d run3d=$run3d runcomplex=$runcomplex"
          echo "run2d=$run2d" >> "$GITHUB_OUTPUT"
          echo "run3d=$run3d" >> "$GITHUB_OUTPUT"
          echo "runcomplex=$runcomplex" >> "$GITHUB_OUTPUT"

  test-2d:
    name: 2-D Geo Builder (src/ + server/)
    needs: changes
    if: needs.changes.outputs.run2d == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # #846: this lane runs check-sibling-safety, which diffs against the PR base. At the
          # default depth 1 that commit is not fetched and nothing can be classified.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite, 2-D bundle)
        run: npm run build

      # The proxy esbuild bundle is part of the release surface (RUNBOOK step 4) but no lane
      # built it, so a server/ change that broke the BUNDLING step passed CI green and failed
      # only at deploy time (issue #56). esbuild takes seconds — run it in every lane.
      - name: Build proxy (shared server bundle)
        run: npm run build:proxy

      - name: Test (2-D + shared server)
        run: npx vitest run src/ server/

      # The sibling guarantee (ADR-W-017) applies to EVERY lane, not just complex (#846, operator
      # ruling 2026-09-01). Before this, a 2-D-only PR got no sibling verification at all.
      - name: Sibling safety (other products still build; no sibling file touched)
        run: node scripts/check-sibling-safety.mjs --product 2d --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  test-3d:
    name: 3-D Space Builder (src3d/ + server/)
    needs: changes
    if: needs.changes.outputs.run3d == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # #846: this lane runs check-sibling-safety, which diffs against the PR base. At the
          # default depth 1 that commit is not fetched and nothing can be classified.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite, 3-D bundle)
        run: npm run build:3d

      # Same rationale as the 2-D lane (issue #56): the proxy bundle must not be able to
      # break without CI noticing, whichever lane a server/shared change lands in.
      - name: Build proxy (shared server bundle)
        run: npm run build:proxy

      - name: Test (3-D + shared server)
        run: npx vitest run src3d/ server/

      # The sibling guarantee (ADR-W-017) applies to EVERY lane, not just complex (#846, operator
      # ruling 2026-09-01). Before this, a 3-D-only PR got no sibling verification at all.
      - name: Sibling safety (other products still build; no sibling file touched)
        run: node scripts/check-sibling-safety.mjs --product 3d --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  test-complex:
    name: Complex Builder (src-complex/ + shell/ + server/)
    needs: changes
    if: needs.changes.outputs.runcomplex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # #846: this is the ONLY job that runs check-sibling-safety, and that script needs the PR
          # base commit. At the default depth 1 the base is not fetched, so its HEAD~1 fallback --
          # which exists to make a fresh clone work -- is itself absent and the lane dies before any
          # test runs. The sibling guarantee (ADR-W-017) is why this lane exists; it needs history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite, complex bundle)
        run: npm run build:complex

      # Same rationale as the other two lanes (issue #56): the proxy bundle must not be able
      # to break without CI noticing, whichever lane a server/shared change lands in.
      - name: Build proxy (shared server bundle)
        run: npm run build:proxy

      # shell/ rides in this lane because complex is its only consumer (ADR-W-019); sibling
      # lanes adopt it when their trees do (Track B).
      - name: Test (complex + shell + shared server)
        run: npx vitest run src-complex/ shell/ server/

      # The sibling guarantee (ADR-W-017) is the reason this lane exists at all: a change here
      # must not be able to regress a shipped product, and the check proves it in seconds.
      - name: Sibling safety (2-D and 3-D still build; no sibling file touched)
        run: node scripts/check-sibling-safety.mjs --product complex --base "${{ github.event.pull_request.base.sha || github.event.before }}"
