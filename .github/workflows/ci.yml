name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reports/**'
      - 'deploy/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'reports/**'
      - 'deploy/**'
      - '.claude/**'

# A newer push to the same branch/PR cancels the still-running older run —
# only the latest state matters, and each run costs ~13 free-tier minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Test
        run: npm run test:run
